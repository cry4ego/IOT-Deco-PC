; DeskMon - PlatformIO (VS Code)
; Dùng chung file .ino với Arduino IDE: src_dir trỏ thẳng vào thư mục sketch.
;
; Mặc định dùng nền tảng espressif32 chính thức (Arduino core 2.0.x).
; Muốn dùng core 3.x (pioarduino, khớp esp32 3.3.9 trong README): bật
; LongPathsEnabled của Windows trước (gói thư viện 3.x có đường dẫn > 260 ký tự),
; rồi thay dòng platform bằng:
;   platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip

;
; Nạp firmware:
;   qua cáp USB : env esp32dev (mặc định)  ->  pio run -t upload
;   qua WiFi    : env ota                  ->  pio run -e ota -t upload

[platformio]
src_dir = esp32/deskmon_esp32
default_envs = esp32dev

[env:esp32dev]
platform = platformio/espressif32@6.13.0
board = esp32dev
framework = arduino
lib_deps =
    lovyan03/LovyanGFX
    bblanchon/ArduinoJson@^7
board_build.partitions = min_spiffs.csv ; 2 x 1.9 MB app -> nạp được qua WiFi (OTA)

upload_speed = 921600
monitor_speed = 921600                  ; = SERIAL_BAUD trong firmware
monitor_filters = esp32_exception_decoder

[env:ota]
extends = env:esp32dev
; Nạp qua trang /update của web cấu hình (HTTP, không bị tường lửa Windows chặn như espota)
upload_protocol = custom
upload_command = curl --fail --silent --show-error -F "firmware=@$SOURCE" http://deskmon.local/update
