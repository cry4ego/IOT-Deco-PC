; Màn hình phụ - firmware ESP32 (dự án riêng, không đụng tới DeskMon ở thư mục gốc)
; Mở thư mục monitor/ trong VS Code để build/nạp dự án này.
;
; Nạp firmware:
;   qua cáp USB : env esp32dev (mặc định)  ->  pio run -t upload
;   qua WiFi    : env ota                  ->  pio run -e ota -t upload
;
; Quay lại DeskMon cũ: ở thư mục gốc chạy  pio run -e ota -t upload  (firmware này vẫn nhận
; nạp qua http://deskmon.local/update giống DeskMon).

[platformio]
src_dir = esp32/man_phu
default_envs = esp32dev

[env:esp32dev]
platform = platformio/espressif32@6.13.0
board = esp32dev
framework = arduino
lib_deps =
    lovyan03/LovyanGFX
    bblanchon/ArduinoJson@^7
board_build.partitions = min_spiffs.csv ; giống DeskMon: 2 vùng app, nạp qua WiFi qua lại được

upload_speed = 921600
monitor_speed = 2000000                 ; = SERIAL_BAUD trong firmware
monitor_filters = esp32_exception_decoder

[env:ota]
extends = env:esp32dev
upload_protocol = custom
upload_command = curl --fail --silent --show-error -F "firmware=@$SOURCE" http://deskmon.local/update
